<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HMS | Create Account</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-brand">

            <div class="brand-symbol">+</div>

            <h1>Hospital Management System</h1>

            <p>Create your patient account</p>

        </div>


        <div class="auth-card">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register as a patient to manage your appointments and records.
            </p>


            <form id="signupForm">

                <div class="form-row">

                    <div class="field">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="field">

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                    </div>

                </div>


                <label class="terms">

                    <input type="checkbox" id="terms" required>

                    <span>
                        I agree to the hospital terms and conditions.
                    </span>

                </label>


                <button type="submit">
                    Create Account
                </button>


                <div id="signupMessage"></div>


                <p class="bottom-text">

                    Already have an account?

                    <a href="login.html">
                        Sign In
                    </a>

                </p>

            </form>

        </div>

    </div>


    <script src="js/signup.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HMS | Forgot Password</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <div class="auth-container">


        <div class="auth-brand">

            <div class="brand-symbol">
                +
            </div>

            <h1>
                Account Recovery
            </h1>

            <p>
                Recover your Hospital Management
                System account securely.
            </p>

        </div>



        <div class="auth-card">

            <h2>
                Forgot Password?
            </h2>

            <p class="subtitle">

                Enter your registered email address
                to receive a password reset link.

            </p>


            <form id="forgotForm">


                <div class="field">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <button type="submit">

                    Send Reset Link

                </button>


                <div id="forgotMessage"></div>


                <p class="bottom-text">

                    Remember your password?

                    <a href="login.html">
                        Back to Sign In
                    </a>

                </p>


            </form>

        </div>

    </div>


    <script src="js/forgot-password.js"></script>

</body>

</html>
